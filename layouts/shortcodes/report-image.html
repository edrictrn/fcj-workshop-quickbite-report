{{ $src := .Get "src" }}
{{ $alt := .Get "alt" }}
{{ $caption := .Get "caption" }}
<figure style="margin: 1.5em 0; text-align: center;">
  <img
    src="{{ $src | relURL }}"
    alt="{{ $alt }}"
    style="max-width: 100%; height: auto; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.15);"
  />
  {{ with $caption }}
  <figcaption style="margin-top: 0.5em; font-size: 0.9em; color: #666;">{{ . }}</figcaption>
  {{ end }}
</figure>
